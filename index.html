<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Player</title>
<link rel="icon" type="image/svg+xml" href="./music-player-song-svgrepo-com1.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true">
  <span class="orb orb--cyan"></span>
  <span class="orb orb--violet"></span>
  <span class="orb orb--pink"></span>
</div>

<main class="player" id="player">

  <header class="player__top">
    <button class="icon-btn" id="queue-toggle" title="Navbat" aria-label="Navbatni ochish">
      <i class="fa-solid fa-bars"></i>
    </button>
    <span class="player__eyebrow">Nova Player</span>
    <button class="icon-btn icon-btn--fav" id="favorite-btn" title="Sevimlilarga qo'shish" aria-label="Sevimli">
      <i class="fa-regular fa-heart"></i>
    </button>
  </header>

  <div class="art-stage">
    <canvas id="visualizer" class="visualizer" width="280" height="280" aria-hidden="true"></canvas>
    <div class="disc" id="disc">
      <div class="disc__art" id="disc-art"></div>
      <div class="disc__hole"></div>
    </div>
  </div>

  <div class="song-info">
    <h1 class="song-info__title" id="song-title">Qo'shiq tanlanmagan</h1>
    <p class="song-info__artist" id="artist-name">—</p>
  </div>

  <div class="progress-row">
    <span class="time time--current" id="current-time">0:00</span>
    <div class="progress" id="progress" role="slider" aria-label="Ijro holati" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress__buffer" id="progress-buffer"></div>
      <div class="progress__fill" id="progress-fill"></div>
      <div class="progress__thumb" id="progress-thumb"></div>
    </div>
    <span class="time time--total" id="total-time">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl ctrl--sm" id="shuffle-btn" title="Aralash" aria-label="Aralash tartibda">
      <i class="fa-solid fa-shuffle"></i>
    </button>
    <button class="ctrl" id="prev-btn" title="Oldingi" aria-label="Oldingi qo'shiq">
      <i class="fa-solid fa-backward-step"></i>
    </button>
    <button class="ctrl ctrl--play" id="play-pause-btn" title="Ijro / Pauza" aria-label="Ijro yoki pauza">
      <i class="fa-solid fa-play"></i>
    </button>
    <button class="ctrl" id="next-btn" title="Keyingi" aria-label="Keyingi qo'shiq">
      <i class="fa-solid fa-forward-step"></i>
    </button>
    <button class="ctrl ctrl--sm" id="repeat-btn" title="Takrorlash" aria-label="Takrorlash rejimi">
      <i class="fa-solid fa-repeat"></i>
    </button>
  </div>

  <div class="bottom-row">
    <div class="volume">
      <button class="icon-btn icon-btn--ghost" id="volume-icon" aria-label="Ovoz balandligi">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <input type="range" min="0" max="1" step="0.01" value="1" class="volume__slider" id="volume-slider" aria-label="Ovoz balandligi darajasi">
    </div>
    <div class="bottom-row__actions">
      <span class="speed-chip" id="speed-btn" title="Ijro tezligi">1.0x</span>
      <button class="icon-btn icon-btn--ghost" id="connect-btn" title="Qurilmadan musiqa yuklash" aria-label="Fayl yuklash">
        <i class="fa-solid fa-file-arrow-up"></i>
      </button>
    </div>
  </div>

</main>

<aside class="queue" id="queue" aria-hidden="true">
  <div class="queue__panel">
    <div class="queue__header">
      <div class="queue__tabs">
        <button class="queue__tab is-active" data-tab="all">Barchasi</button>
        <button class="queue__tab" data-tab="favorites">Sevimlilar</button>
      </div>
      <button class="icon-btn" id="queue-close" aria-label="Yopish">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <ul class="queue__list" id="queue-list"></ul>
    <div class="queue__empty" id="queue-empty" hidden>
      <i class="fa-regular fa-heart"></i>
      <p>Bu yerda hali hech narsa yo'q</p>
    </div>
    <button class="queue__upload" id="queue-upload-btn">
      <i class="fa-solid fa-plus"></i> Qurilmadan qo'shish
    </button>
  </div>
</aside>
<div class="queue__scrim" id="queue-scrim"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="local-file-input" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script src="./main.js"></script>
</body>
</html>
